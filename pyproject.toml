[project]
name = "paddleocr-vl"
version = "0.1.0"
description = "Convert PDFs to Markdown using the PaddleOCR-VL-1.5 Baidu API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
paddleocr-vl = "paddleocr_vl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paddleocr_vl"]
