[project]
name = "paddleocr-vl"
version = "0.1.0"
description = "Convert PDFs to Markdown using the PaddleOCR-VL-1.5 Baidu API"
authors = [{name = "yuwenjie"}]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pdf", "ocr", "paddleocr", "markdown", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.scripts]
paddleocr-vl = "paddleocr_vl.cli:main"

[project.urls]
Homepage = "https://github.com/raawaa/paddleocr-vl"
Repository = "https://github.com/raawaa/paddleocr-vl"
"Bug Tracker" = "https://github.com/raawaa/paddleocr-vl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paddleocr_vl"]
